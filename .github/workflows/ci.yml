name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test:sync
      - run: bun run test:storage
      - run: bun run test:tree
      - run: bun run test:duplicates
      - run: bun run test:merge
      - run: bun run test:search
      - run: bun run test:trash
      - run: bun run test:api
      - run: bun run test:deploy
      - run: bun run test:delta
      - run: bun run test:firestore
      - run: bun run build
      - run: bun run test:server
      - name: Build production container
        run: docker build --tag my-root-cuba:ci .
      - name: Check production container
        run: node scripts/check-container.mjs my-root-cuba:ci
